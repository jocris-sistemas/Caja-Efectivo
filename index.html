function renderLogin(msg = '') {
  $('#app').innerHTML = `
  <div class="login">
    <div class="logo"><b>JOCRIS</b><span>Caja de Efectivo</span></div>
    <div class="box">
      <form id="fLogin">
        <label class="f">Correo</label><input type="email" id="lgMail" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>

      </form>

  </div>`;
  $('#fLogin').onsubmit = async ev => {
    ev.preventDefault(); const b = $('#lgBtn'); b.disabled = true; b.textContent = 'Entrando…';
    const mail = $('#lgMail').value.trim().toLowerCase();
    const back = m => { renderLogin(m); $('#lgMail').value = mail; };
    let error;
    try { ({ error } = await sb.auth.signInWithPassword({ email: mail, password: $('#lgPass').value })); } catch (e) { error = e; }
    if (error) {

      back(/invalid login|invalid_credentials|credentials/i.test(m) ? 'Correo o contraseña incorrectos.'
        : /fetch|network|load failed/i.test(m) ? 'No hay conexión con el servidor. Revisa tu internet e inténtalo de nuevo.'
        : 'No se pudo entrar: ' + m); return;
    }
    try { await boot(); } catch (e) { back('Entraste, pero la app no pudo cargar: ' + String(e.message || e)); }
  };
}
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  const { data: p } = await sb.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
  if (!p || !p.activo) { await sb.auth.signOut(); return renderLogin('Tu usuario no está activo en el sistema. Avísale a Pedro.'); }
  S.perfil = p;
  $('#app').innerHTML = '<div class="spin">Cargando…</div>';
  const c = await sb.from('cargos').select('*').eq('activo', true).order('id');
  S.cargos = (c.data || []).filter(x => x.nombre !== 'SIN CARGO');
  S.tab = 'caja';
  renderShell();
}

function go(tab, opts) {
  S.tab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab !== 'nuevo') S.F = null;
  if (tab === 'sem' && !(opts && opts.keep)) S.semSel = null;
  ({ caja: viewCaja, mov: viewMov, nuevo: viewNuevo, arq: viewArq, sem: viewSem, bit: viewBit }[tab])(opts);
  window.scrollTo(0, 0);
}

  const titulo = ent ? (m.concepto || 'ENTRADA DE EFECTIVO') : (m.proveedor || m.concepto || '—');

    const mes = (await sb.from('caja_movimientos').select(SEL).eq('estatus', 'vigente').gte('fecha', ym + '-01').lt('fecha', nx).order('fecha', { ascending: false })).data || [];

async function cargarMeses() {
  const r = await sb.from('caja_movimientos').select('fecha').order('fecha', { ascending: false }).limit(5000);
  const set = [...new Set((r.data || []).map(x => String(x.fecha).slice(0, 7)))].sort().reverse();
  S.meses = set; const el = $('#fmes'); if (!el) return;
  el.innerHTML = `<option value="">Todos los meses</option>` + set.map(m => `<option value="${m}" ${S.filt.mes === m ? 'selected' : ''}>${esc(mesTxt(m))}</option>`).join('');
}
async function loadMov() {
  const box = $('#movList'); if (!box) return;
  let q = sb.from('caja_movimientos').select(SEL, { count: 'exact' });
  const f = S.filt;
  if (f.tipo) q = q.eq('tipo', f.tipo);
  if (f.cargo) q = q.eq('cargo_id', Number(f.cargo));
  if (f.mes) { const [y, m] = f.mes.split('-').map(Number); q = q.gte('fecha', f.mes + '-01').lt('fecha', m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`); }
  if (f.q) { const t = f.q.replace(/[,()%]/g, ' '); q = q.or(`proveedor.ilike.%${t}%,concepto.ilike.%${t}%,folio_numero.ilike.%${t}%`); }
  if (S._soloFaltan) q = q.eq('tipo', 'gasto').eq('estatus', 'vigente').eq('es_historial', false);
  q = q.order('fecha', { ascending: false }).order('numero', { ascending: false }).range(S.page * PAGE, S.page * PAGE + PAGE - 1);
  const { data, count, error } = await q;
  if (error) return box.innerHTML = `<div class="warnbox">${esc(errMsg(error))}</div>`;
  let rows = data || [];
  if (S._soloFaltan) rows = rows.filter(x => !archAct(x).length && !sinComprobante(x));
  S.count = count || 0;
  if (S.page === 0) S.list = rows; else S.list = S.list.concat(rows);
  let html = '', last = '';
  S.list.forEach(m => { if (m.fecha !== last) { last = m.fecha; html += `<div class="dayh">${esc(fdia(m.fecha))}</div>`; } html += itemMov(m); });
  if (!S.list.length) html = `<div class="card empty">${ICON.empty}<div>No hay movimientos con ese filtro.</div></div>`;
  if ((S.page + 1) * PAGE < S.count) html += `<div class="r" style="margin:8px 0"><button class="btn ghost" data-act="mas">Ver más</button></div>`;
  box.className = ''; box.innerHTML = `<div class="mut sm" style="margin:0 4px 6px">${S.count} movimiento(s)</div>` + html;
}

/* ===================== ARCHIVOS ===================== */
function pickFiles(multiple = true) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*,application/pdf'; i.multiple = multiple;
    i.onchange = () => res([...i.files]); i.click();
  });
}
function pickCamara() {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment');
    i.onchange = () => res([...i.files]); i.click();
  });
}
function pickFuente() {
  if (!(window.matchMedia && matchMedia('(pointer:coarse)').matches)) return pickFiles(true);
  return new Promise(res => {
    const files = []; const ov = document.createElement('div'); ov.className = 'overlay'; ov.style.zIndex = 70;
    const cierra = r => { ov.remove(); res(r); };
    const pinta = () => {
      ov.innerHTML = `<div class="sheet"><h2 style="margin-top:0">Agregar ticket</h2>
        <div class="row" style="flex-direction:column;gap:10px;align-items:stretch">
          <button class="btn gold" id="fzCam">📷 Tomar foto ahora</button>
          <button class="btn ghost" id="fzGal">Elegir de la galería o archivos</button></div>
        ${files.length ? `<div class="mut sm" style="margin-top:12px">${files.length} archivo(s) listo(s). Si el ticket tiene varias hojas, toma una foto de cada una y toca “Listo”.</div>
          <div class="thumbs">${files.map(f => f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}">` : `<span class="chip">${esc(f.name)}</span>`).join('')}</div>` : ''}
        <div class="row" style="margin-top:14px"><button class="btn ok grow" id="fzOk" ${files.length ? '' : 'disabled'}>Listo${files.length ? ' (' + files.length + ')' : ''}</button><button class="btn ghost" id="fzNo">Cancelar</button></div></div>`;
      ov.querySelector('#fzCam').onclick = async () => { const f = await pickCamara(); if (f.length) { files.push(...f); pinta(); } };
      ov.querySelector('#fzGal').onclick = async () => { const f = await pickFiles(true); if (f.length) { files.push(...f); pinta(); } };
      ov.querySelector('#fzOk').onclick = () => cierra(files);
      ov.querySelector('#fzNo').onclick = () => cierra([]);
    };
    pinta(); document.body.appendChild(ov);
  });
}
function loadImg(file, maxDim = 1800) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = () => {
      let { width: w, height: h } = im; const k = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url); res({ data: cv.toDataURL('image/jpeg', 0.82), w, h });
    };
    im.onerror = () => rej(new Error('No se pudo leer la imagen.')); im.src = url;
  });
}
async function filesToPdf(files) {
  if (files.length === 1 && files[0].type === 'application/pdf') return files[0];
  if (files.some(f => f.type === 'application/pdf')) throw new Error('No mezcles PDFs con fotos: sube el PDF solo.');
  const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'a4' }); let first = true;
  for (const f of files) {
    const im = await loadImg(f); if (!first) doc.addPage(); first = false;
    const pw = 210, ph = 297, m = 8, r = Math.min((pw - 2 * m) / im.w, (ph - 2 * m) / im.h);

const GRUPOS_ORD = ['OFICINA', 'JOCRIS', 'ANGEL', 'ING. OMAR', 'ING. EGBERT', 'ING. RENE', 'MAQUINARIA', 'JCGP', 'CANCUN', 'ERICK', 'OTROS', 'CONTRATISTAS'];
const MES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fsem = d => { const [y, m, dd] = d.split('-'); return `${Number(dd)} ${MES_C[Number(m) - 1]} ${y}`; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const ordGrupo = g => { const i = GRUPOS_ORD.indexOf(g); return i < 0 ? 99 : i; };
async function cargarHist(force) {
  if (S.hist && !force) return S.hist;
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from('caja_historial_semanal').select('semana,orden,folio,grupo,concepto,importe,nota')
      .order('semana', { ascending: true }).order('orden', { ascending: true }).range(from, from + 999);
    if (error) throw error;
    all = all.concat(data || []); if (!data || data.length < 1000) break; from += 1000;
  }
  const by = {};
  all.forEach(r => { const w = by[r.semana] || (by[r.semana] = { semana: r.semana, c: 0, rows: [] }); w.c += cents(r.importe); w.rows.push(r); });

}

    <div class="semnav">${vieja ? `<button class="btn ghost sm" data-act="sem" data-id="${vieja.semana}">‹ ${esc(fsem(vieja.semana))}</button>` : ''}${nueva ? `<button class="btn ghost sm" data-act="sem" data-id="${nueva.semana}">${esc(fsem(nueva.semana))} ›</button>` : ''}</div>
    ${gs.map(g => `<details class="sg" open><summary><span class="gn">${esc(g.nombre)}</span><span class="pc">${w.c ? Math.round(g.c / w.c * 100) : 0}%</span><span class="gt">${fmt(g.c / 100)}</span></summary>${g.rows.map(r => lineaSem(r)).join('')}</details>`).join('')}
    <div class="r" style="margin:6px 0 12px"><button class="btn ghost sm" data-act="semxls" data-id="${w.semana}">Descargar esta semana en Excel</button></div>`;
}
async function semExcel(semana) {
  await cargarSheetJS(); await cargarHist();
  const wb = XLSX.utils.book_new(); const num = v => Number(v);
  const det = r => ({ Semana: r.semana, Grupo: r.grupo, Folio: r.folio || '', Concepto: r.concepto, Importe: num(r.importe), Nota: r.nota || '' });
  if (semana) {
    const w = S.semanas.find(x => x.semana === semana);
    const rows = gruposDe(w).flatMap(g => g.rows).map(det); rows.push({ Semana: semana, Grupo: 'TOTAL', Folio: '', Concepto: '', Importe: w.c / 100, Nota: '' });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Semana ' + semana);
    XLSX.writeFile(wb, `Gasto_semanal_${semana}.xlsx`);
  } else {
    const asc = [...S.semanas].reverse();
    const todos = [...new Set(S.hist.map(r => r.grupo || 'OTROS'))].sort((x, y) => ordGrupo(x) - ordGrupo(y) || x.localeCompare(y));
    const res = asc.map(w => { const o = { Semana: w.semana, Lineas: w.rows.length }; todos.forEach(g => o[g] = 0); gruposDe(w).forEach(g => o[g.nombre] = g.c / 100); o.TOTAL = w.c / 100; return o; });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(res), 'Resumen semanal');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.hist.map(det)), 'Detalle');
    XLSX.writeFile(wb, `Gasto_semanal_${asc[0].semana.slice(0, 4)}_historial.xlsx`);
  }
  toast('Excel descargado.', 'ok');
}

/* ===================== VISTA: BITACORA ===================== */
async function viewBit() {
  $('#view').innerHTML = `<div class="pagehead"><h2>Bitácora de caja</h2><span class="sub">Registro permanente; no se puede borrar ni editar</span></div><div id="bitList" class="spin">Cargando…</div>`;
  const { data, error } = await sb.from('caja_bitacora').select('*').order('creado_en', { ascending: false }).limit(150);
  if (error) return $('#bitList').innerHTML = `<div class="warnbox">${esc(errMsg(error))}</div>`;
  $('#bitList').className = '';
  $('#bitList').innerHTML = (data || []).map(b => {
    const d = b.detalle || {}; let x = '';
    if (d.monto != null) x += ' · ' + fmt(d.monto);
    if (d.motivo) x += ' · ' + esc(d.motivo);
    if (b.accion === 'arqueo') x = ` · sistema ${fmt(d.saldo)} · contado ${fmt(d.contado)}`;
    return `<div class="log"><b>${esc(b.accion.replace(/_/g, ' '))}</b>${x} · ${esc(b.usuario_nombre || '')}<br><span class="mut">${fdt(b.creado_en)}</span>${b.movimiento_id ? ` · <a href="#" data-act="detalle" data-id="${b.movimiento_id}" style="color:var(--navy2)">ver movimiento</a>` : ''}</div>`;
  }).join('') || `<div class="card empty">${ICON.empty}<div>Sin registros.</div></div>`;
}

/* ===================== CUENTA / RESPALDO ===================== */
function menuCuenta() {
  openModal(`<h2 style="margin-top:0">Mi cuenta</h2><div class="card"><div class="b">${esc(S.perfil.nombre)}</div><div class="mut">${esc(S.perfil.correo)} · ${esc(rolTxt(S.perfil.rol))}</div></div>
  <h3>Control de Cheques</h3><a class="btn ghost" href="https://jocris-sistemas.github.io/Control-Cheques/" style="text-decoration:none">Ir a Control de Cheques</a>
  <h3>Cambiar contraseña</h3><label class="f">Nueva contraseña (mínimo 8 caracteres)</label>${pwField('np1', 'new-password')}<label class="f">Repítela</label>${pwField('np2', 'new-password')}
  <div class="row" style="margin-top:12px"><button class="btn" data-act="cambiarpass">Guardar contraseña</button><button class="btn ghost" data-act="salir">Cerrar sesión</button></div>
  <h3>Respaldo</h3><div class="mut sm" style="margin-bottom:6px">Descarga todos los movimientos, arqueos y la bitácora de la caja en un Excel.</div><button class="btn ghost" id="btnRespaldo" data-act="respaldo">Descargar respaldo en Excel</button>`);
}
function cargarSheetJS() {
  return new Promise((res, rej) => {
    if (window.XLSX) return res();
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar el generador de Excel. Revisa tu internet.')); document.head.appendChild(s);
  });
}
async function traerTodo(tabla, orden) {
  let all = [], from = 0;
  for (;;) {
    const { data, error } = await sb.from(tabla).select('*').order(orden, { ascending: true }).range(from, from + 999);
    if (error) throw error; all = all.concat(data || []); if (!data || data.length < 1000) break; from += 1000;
  }
  return all;
}
async function respaldoExcel() {
  const b = $('#btnRespaldo'); if (b) { b.disabled = true; b.textContent = 'Preparando…'; }
  try {
    await cargarSheetJS();
    const [mov, arq, bit] = await Promise.all([traerTodo('caja_movimientos', 'numero'), traerTodo('caja_arqueos', 'creado_en'), traerTodo('caja_bitacora', 'id')]);
    const arch = await traerTodo('caja_archivos', 'creado_en');
    const nFiles = {}; arch.filter(a => a.activo).forEach(a => nFiles[a.movimiento_id] = (nFiles[a.movimiento_id] || 0) + 1);
    const wb = XLSX.utils.book_new();
    const sheet = (rows, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ info: 'Sin datos' }]), name);
    sheet(mov.map(m => ({ Numero: m.numero, Tipo: m.tipo, Fecha: m.fecha, Monto: Number(m.monto), Cargo: m.cargo_id ? cargoNombre(m.cargo_id) : '', Folio: m.folio_numero || '', Proveedor: m.proveedor || '', Concepto: m.concepto || '', Nota: m.nota || '',
      Estatus: m.estatus, Historial: m.es_historial ? 'SI' : '', 'Archivos': nFiles[m.id] || 0, 'Capturo': m.creado_por_nombre || '', 'Capturado en': m.creado_en, 'Motivo anulacion': m.motivo_anulacion || '', 'Anulado por': m.anulado_por_nombre || '' })), 'Movimientos');
    sheet(arq.map(a => ({ Fecha: a.fecha, 'Saldo sistema': Number(a.saldo_sistema), 'Efectivo contado': Number(a.efectivo_contado), Diferencia: Number(a.diferencia), Nota: a.nota || '', Por: a.creado_por_nombre || '', 'Registrado en': a.creado_en })), 'Arqueos');
    sheet(bit.map(x => ({ Fecha: x.creado_en, Usuario: x.usuario_nombre || '', Accion: x.accion, Detalle: x.detalle ? JSON.stringify(x.detalle) : '' })), 'Bitacora');
    XLSX.writeFile(wb, `Respaldo_Caja_Jocris_${today()}.xlsx`);
    toast('Respaldo descargado.', 'ok');
  } catch (e) { toast(errMsg(e), 'err'); }
  finally { const b2 = $('#btnRespaldo'); if (b2) { b2.disabled = false; b2.textContent = 'Descargar respaldo en Excel'; } }
}

/* ===================== EVENTOS ===================== */
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.matches || !el.matches('input[type=text], textarea')) return;
  const v = el.value, u = v.toUpperCase(); if (v === u) return;
  const a = el.selectionStart, b = el.selectionEnd; el.value = u; try { el.setSelectionRange(a, b); } catch (e) {}
}, true);
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'fSinT' && S.F) { S.F.sinT = el.checked; S.F.motivoT = ''; pintaTicket(); }
  if (el.id === 'fMotivoT' && S.F) S.F.motivoT = el.value;
});
document.addEventListener('click', async ev => {
  const tabBtn = ev.target.closest('nav.tabs button'); if (tabBtn) return go(tabBtn.dataset.tab);
  const goBtn = ev.target.closest('[data-tab-go]'); if (goBtn) return go(goBtn.dataset.tabGo);
  const el = ev.target.closest('[data-act]'); if (!el) return; const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'A') ev.preventDefault();
  try {
    switch (act) {
      case 'ovl': if (ev.target === el) closeModal(); break;
      case 'close': closeModal(); break;
      case 'menu': menuCuenta(); break;
      case 'salir': await sb.auth.signOut(); S.perfil = null; closeModal(); renderLogin(); break;
      case 'verpass': { const i = document.getElementById(el.dataset.for); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; el.innerHTML = show ? EYE_OFF : EYE; break; }
      case 'cambiarpass': {
        const a = $('#np1').value, b = $('#np2').value;
        if (a.length < 8) return toast('La contraseña debe tener al menos 8 caracteres.', 'err');
        if (a !== b) return toast('Las contraseñas no coinciden.', 'err');
        const { error } = await sb.auth.updateUser({ password: a }); if (error) throw error; toast('Contraseña actualizada.', 'ok'); closeModal(); break;
      }
      case 'respaldo': await respaldoExcel(); break;
      case 'nuevo': go('nuevo', { tipo: el.dataset.tipo }); break;
      case 'faltantes': go('mov', { sinTicket: true }); break;
      case 'quitarfaltan': S._soloFaltan = false; viewMov({ keep: true }); break;
      case 'mas': S.page++; await loadMov(); break;
      case 'sem': S.semSel = id; viewSem(); window.scrollTo(0, 0); break;
      case 'sembak': S.semSel = null; viewSem(); window.scrollTo(0, 0); break;
      case 'semxls': await semExcel(id); break;
      case 'semxlsall': await semExcel(null); break;
      case 'detalle': closeModal(); await openDetail(id); break;
      case 'abrir': await abrirPath(el.dataset.path); break;
      case 'tipo': if (S.F) { const keepFiles = S.F.files; S.F.tipo = el.dataset.tipo; S.F.sinT = false; pintaForm(); } break;
      case 'pickticket': { const fs = await pickFuente(); if (fs.length) { S.F.files = S.F.files.concat(fs); pintaTicket(); } break; }
      case 'limpiarticket': S.F.files = []; pintaTicket(); break;
      case 'revisar': await revisar(); break;
      case 'guardar': await guardar(); break;
      case 'addfile': {
        const fs = await pickFuente(); if (!fs.length) break; toast('Subiendo…');
        await subirArchivo(id, fs); toast('Archivo agregado.', 'ok'); await openDetail(id); break;
      }
      case 'quitarfile': {
        const mot = prompt('¿Por qué quitas este archivo? (queda registrado)'); if (!mot || !mot.trim()) break;
        await rpc('caja_quitar_archivo', { p_archivo: id, p_motivo: mot.trim().toUpperCase() }); toast('Archivo quitado.', 'ok'); await openDetail(el.dataset.mov); break;
      }
      case 'anular': {
        openModal(`<h2 style="margin-top:0">Anular movimiento</h2><div class="warnbox">El movimiento no se borra: queda marcado como anulado, con tu nombre y el motivo, y el saldo se corrige.</div>
          <label class="f">Motivo (obligatorio)</label><textarea id="anMot"></textarea>
          <div class="row" style="margin-top:12px"><button class="btn bad grow" data-act="anular2" data-id="${id}">Anular</button><button class="btn ghost" data-act="detalle" data-id="${id}">Volver</button></div>`);
        break;
      }
      case 'anular2': {
        const mot = $('#anMot').value.trim().toUpperCase(); if (!mot) return toast('Escribe el motivo.', 'err');
        el.disabled = true; await rpc('caja_anular', { p_id: id, p_motivo: mot }); closeModal(); toast('Movimiento anulado.', 'ok'); go(S.tab); break;
      }
      case 'arqueo': {
        const v = parseMoney($('#aqMonto').value); if (isNaN(v) || v < 0) return toast('Escribe el efectivo contado.', 'err');
        const nota = $('#aqNota').value.trim().toUpperCase();
        if (cents(v) !== cents(S._saldoArq) && !nota) return toast('Hay diferencia: escribe una nota que la explique.', 'err');
        el.disabled = true;
        await rpc('caja_arqueo', { p_contado: v, p_nota: nota || null }); toast('Arqueo registrado.', 'ok'); viewArq(); break;
      }
    }
  } catch (e) { toast(errMsg(e), 'err'); if (el && el.disabled) el.disabled = false; }
});
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT' && S.perfil) { S.perfil = null; renderLogin(); } });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
boot().catch(e => renderLogin('No se pudo cargar: ' + errMsg(e)));
</script>
